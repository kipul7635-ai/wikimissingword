<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What's missing?</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap');

  /* Register --accent as a real <color> so it can be transitioned */
  @property --accent {
    syntax: '<color>';
    inherits: true;
    initial-value: #22b573;
  }

  :root {
    --ink: #0d3b5c;
    --ink-soft: #3f6a88;

    --accent: #22b573;
    --accent-hi: color-mix(in srgb, var(--accent) 55%, #fff);
    --accent-lo: color-mix(in srgb, var(--accent) 72%, #04243c);
    --accent-ink: color-mix(in srgb, var(--accent) 55%, #05223a);

    --correct-hi: #5fe08a;
    --correct-lo: #14933f;
    --present-hi: #ffe27a;
    --present-lo: #f2a900;
    --absent-hi: #9db6c9;
    --absent-lo: #6b869c;

    /* Glossy highlight laid over any coloured gel */
    --gloss: linear-gradient(180deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,.14) 50%, rgba(255,255,255,0) 51%);

    transition: --accent 0.7s cubic-bezier(0.4, 0, 0.2, 1);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: linear-gradient(180deg, #4db8f2 0%, #8fd8fb 38%, #d6f3ff 72%, #e9fbff 100%) fixed;
    color: var(--ink);
    font-family: 'Nunito Sans', 'Segoe UI', 'Frutiger', 'Trebuchet MS', sans-serif;
    font-size: 16px;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 32px 16px 120px;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ---------- Sky scenery ---------- */
  .sky {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .sun {
    position: absolute;
    top: -38vmax;
    left: 50%;
    width: 90vmax;
    height: 90vmax;
    transform: translateX(-50%);
    background: radial-gradient(circle, rgba(255,255,255,.9) 0%, rgba(255,255,255,.4) 22%, rgba(255,255,255,0) 58%);
  }
  .cloud {
    position: absolute;
    width: 320px;
    height: 120px;
    background:
      radial-gradient(70px 42px at 26% 62%, #fff 55%, transparent 100%),
      radial-gradient(80px 58px at 50% 44%, #fff 55%, transparent 100%),
      radial-gradient(64px 40px at 76% 64%, #fff 55%, transparent 100%);
    filter: blur(5px);
    opacity: .85;
  }
  .cloud.c1 { top: 9vh;  left: -60px; }
  .cloud.c2 { top: 26vh; right: -80px; transform: scale(1.3); opacity: .7; }
  .cloud.c3 { top: 52vh; left: 8vw;   transform: scale(.8);  opacity: .6; }

  .hill {
    position: absolute;
    border-radius: 50%;
    background: linear-gradient(180deg, #b5f283 0%, #4fc25a 45%, #1f8f3e 100%);
    box-shadow: inset 0 14px 30px rgba(255,255,255,.45);
  }
  .hill.h1 { bottom: -22vh; left: -25vw; width: 90vw;  height: 44vh; }
  .hill.h2 { bottom: -26vh; right: -30vw; width: 110vw; height: 42vh;
             background: linear-gradient(180deg, #8de86a 0%, #36b24d 50%, #1a8238 100%); }

  .bubble {
    position: absolute;
    bottom: -90px;
    left: var(--x);
    width: var(--s);
    height: var(--s);
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.85);
    background:
      radial-gradient(circle at 30% 28%, rgba(255,255,255,.95) 0 10%, rgba(255,255,255,0) 26%),
      radial-gradient(circle at 50% 50%, rgba(255,255,255,.08) 55%, rgba(120,215,255,.35) 100%);
    box-shadow: inset 0 -8px 14px rgba(255,255,255,.4), 0 4px 14px rgba(30,140,220,.18);
    animation: rise var(--d) linear var(--delay) infinite;
  }
  @keyframes rise {
    to { transform: translate(24px, -118vh); }
  }

  /* ---------- Glass card ---------- */
  .app {
    width: min(880px, 100%);
    position: relative;
    z-index: 1;
    border-radius: 32px;
    background: linear-gradient(180deg, rgba(255,255,255,.64), rgba(255,255,255,.36) 24%, rgba(255,255,255,.42));
    -webkit-backdrop-filter: blur(20px) saturate(1.5);
    backdrop-filter: blur(20px) saturate(1.5);
    border: 1px solid rgba(255,255,255,.95);
    box-shadow:
      0 30px 60px -22px rgba(8, 80, 140, .5),
      0 0 0 6px rgba(255,255,255,.2),
      inset 0 1px 0 #fff,
      inset 0 -3px 10px rgba(30,140,220,.16),
      0 0 90px -14px color-mix(in srgb, var(--accent) 50%, transparent);
  }
  .app::before {
    content: '';
    position: absolute;
    left: 0; right: 0; top: 0;
    height: 130px;
    border-radius: 32px 32px 50% 50% / 32px 32px 44px 44px;
    background: linear-gradient(180deg, rgba(255,255,255,.6), rgba(255,255,255,0));
    pointer-events: none;
  }

  .window-body { position: relative; padding: 30px 30px 32px; }

  /* ---------- Header ---------- */
  header { text-align: center; margin-bottom: 12px; }
  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .brand-text { text-align: left; }

  .orb {
    position: relative;
    width: 68px;
    height: 68px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    flex: none;
    background:
      radial-gradient(circle at 50% 125%, var(--accent-hi), transparent 62%),
      linear-gradient(180deg, var(--accent-hi), var(--accent) 48%, var(--accent-lo));
    box-shadow:
      0 10px 20px -6px color-mix(in srgb, var(--accent) 80%, #000),
      inset 0 -7px 12px rgba(255,255,255,.35),
      inset 0 0 0 1px rgba(255,255,255,.65);
    color: #fff;
    font: 700 2.15rem/1 Georgia, 'Times New Roman', serif;
    text-shadow: 0 1px 3px rgba(0,30,60,.45);
  }
  .orb::after {
    content: '';
    position: absolute;
    top: 5%; left: 14%; right: 14%;
    height: 46%;
    border-radius: 50% / 62%;
    background: linear-gradient(180deg, rgba(255,255,255,.9), rgba(255,255,255,.08));
  }
  .orb span { position: relative; z-index: 1; margin-top: 4px; }

  h1 {
    margin: 0;
    font-size: 2.9rem;
    font-weight: 800;
    letter-spacing: -0.015em;
    line-height: 1.05;
    color: var(--ink);
    text-shadow: 0 1px 0 #fff, 0 6px 20px rgba(255,255,255,.8);
  }
  .sub {
    margin-top: 6px;
    color: var(--ink-soft);
    font-size: 1.02rem;
    font-weight: 600;
  }

  /* ---------- Passage ---------- */
  .passage {
    margin: 26px auto 4px;
    max-width: 680px;
    padding: 22px 30px;
    border-radius: 22px;
    background: rgba(255,255,255,.58);
    border: 1px solid rgba(255,255,255,.95);
    box-shadow:
      inset 0 1px 0 #fff,
      inset 0 -10px 18px -10px rgba(30,140,220,.2),
      0 10px 20px -12px rgba(8,80,140,.4);
    font-size: 1.12rem;
    line-height: 1.8;
    color: var(--ink);
  }
  .passage p { margin: 0 0 .9em; }
  .passage p:last-child { margin-bottom: 0; }
  .passage .loading { color: var(--ink-soft); text-align: center; font-weight: 600; }

  /* The missing word: a row of little glass slots */
  .blank {
    display: inline-flex;
    gap: 3px;
    margin: 0 3px;
    vertical-align: -.3em;
  }
  .slot {
    width: .92em;
    height: 1.5em;
    display: grid;
    place-items: center;
    border-radius: 7px;
    background: linear-gradient(180deg, rgba(255,255,255,.98), rgba(255,255,255,.6));
    border: 1px solid var(--accent);
    box-shadow: inset 0 2px 4px rgba(8,80,140,.3), 0 0 10px -2px color-mix(in srgb, var(--accent) 60%, transparent);
    font-size: .92em;
    font-weight: 800;
    line-height: 1;
    color: var(--ink);
    text-transform: uppercase;
  }
  .slot.hinted {
    background: var(--gloss), linear-gradient(180deg, var(--accent), var(--accent-lo));
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,30,60,.55);
  }
  .blank.win .slot {
    background: var(--gloss), linear-gradient(180deg, var(--correct-hi), var(--correct-lo));
    border-color: rgba(255,255,255,.7);
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,50,20,.6);
  }
  .blank.lose .slot {
    background: var(--gloss), linear-gradient(180deg, #ff8fa3, #d2284a);
    border-color: rgba(255,255,255,.7);
    color: #fff;
    text-shadow: 0 1px 2px rgba(80,0,20,.55);
  }

  /* ---------- Badge ---------- */
  .badge {
    display: inline-block;
    padding: 8px 22px;
    border-radius: 999px;
    background: var(--gloss), linear-gradient(180deg, var(--accent), var(--accent-lo));
    border: 1px solid color-mix(in srgb, var(--accent) 65%, #000);
    color: #fff;
    font-weight: 700;
    font-size: .95rem;
    text-shadow: 0 1px 2px rgba(0,30,60,.55);
    box-shadow:
      0 8px 16px -8px color-mix(in srgb, var(--accent) 80%, #000),
      inset 0 1px 0 rgba(255,255,255,.7);
  }

  /* ---------- Grid ---------- */
  .grid {
    display: flex;
    flex-direction: column;
    gap: 7px;
    margin: 24px 0;
    align-items: center;
  }
  .row { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; }
  .tile {
    width: 40px; height: 40px;
    display: grid; place-items: center;
    border-radius: 12px;
    background: linear-gradient(180deg, rgba(255,255,255,.9), rgba(255,255,255,.45));
    border: 1px solid rgba(255,255,255,.95);
    box-shadow: inset 0 -4px 8px rgba(30,120,200,.18), 0 4px 9px -4px rgba(8,80,140,.45);
    font-weight: 800;
    font-size: 1.2rem;
    color: var(--ink);
    text-transform: uppercase;
    transition: background .25s, color .25s, box-shadow .25s;
  }
  .tile.correct {
    background: var(--gloss), linear-gradient(180deg, var(--correct-hi), var(--correct-lo));
    color: #fff;
    border-color: rgba(255,255,255,.7);
    text-shadow: 0 1px 2px rgba(0,50,20,.6);
    box-shadow: inset 0 -3px 6px rgba(0,60,20,.25), 0 6px 12px -5px var(--correct-lo);
  }
  .tile.present {
    background: var(--gloss), linear-gradient(180deg, var(--present-hi), var(--present-lo));
    color: #4a2f00;
    border-color: rgba(255,255,255,.7);
    text-shadow: 0 1px 0 rgba(255,255,255,.55);
    box-shadow: inset 0 -3px 6px rgba(120,70,0,.2), 0 6px 12px -5px var(--present-lo);
  }
  .tile.absent {
    background: var(--gloss), linear-gradient(180deg, var(--absent-hi), var(--absent-lo));
    color: #fff;
    border-color: rgba(255,255,255,.6);
    text-shadow: 0 1px 2px rgba(10,30,50,.55);
    box-shadow: inset 0 -3px 6px rgba(10,40,70,.2), 0 4px 9px -5px rgba(10,40,70,.6);
  }
  .tile.small { width: 30px; height: 30px; font-size: 1rem; border-radius: 9px; }
  .gap { width: 14px; }
  .gap.small { width: 9px; }

  /* ---------- Input row ---------- */
  .input-row { display: flex; gap: 10px; margin-top: 12px; }
  input[type="text"] {
    flex: 1;
    min-width: 0;
    padding: 12px 22px;
    border-radius: 999px;
    background: rgba(255,255,255,.88);
    color: var(--ink);
    border: 1px solid rgba(255,255,255,.95);
    box-shadow: inset 0 3px 7px rgba(8,80,140,.28), 0 1px 0 #fff;
    font-family: inherit;
    font-weight: 800;
    font-size: 1.15rem;
    letter-spacing: .22em;
    text-transform: uppercase;
    outline: none;
    caret-color: var(--accent-ink);
    transition: box-shadow .2s, border-color .2s;
  }
  input[type="text"]::placeholder {
    color: #6f8fa8;
    font-weight: 600;
    letter-spacing: .02em;
    text-transform: none;
  }
  input[type="text"]:focus {
    border-color: var(--accent);
    box-shadow:
      inset 0 3px 7px rgba(8,80,140,.22),
      0 0 0 4px color-mix(in srgb, var(--accent) 40%, transparent);
  }
  input:disabled { opacity: .55; }

  /* ---------- Buttons ---------- */
  button {
    font-family: inherit;
    font-weight: 700;
    font-size: 1rem;
    padding: 11px 24px;
    border-radius: 999px;
    color: var(--ink);
    background: var(--gloss), linear-gradient(180deg, #ffffff, #cdeaff);
    border: 1px solid rgba(40,130,200,.55);
    box-shadow: 0 6px 12px -6px rgba(8,80,140,.55), inset 0 1px 0 #fff;
    cursor: pointer;
    user-select: none;
    transition: filter .15s, transform .1s, box-shadow .15s;
  }
  button:hover:not(:disabled) { filter: brightness(1.07) saturate(1.1); }
  button:active:not(:disabled) {
    transform: translateY(1px);
    box-shadow: 0 2px 6px -3px rgba(8,80,140,.55), inset 0 2px 4px rgba(8,80,140,.2);
  }
  button:disabled { opacity: .5; cursor: not-allowed; }

  button.primary {
    color: #fff;
    background: var(--gloss), linear-gradient(180deg, var(--accent), var(--accent-lo));
    border-color: color-mix(in srgb, var(--accent) 65%, #000);
    text-shadow: 0 1px 2px rgba(0,30,60,.55);
    box-shadow:
      0 8px 16px -8px color-mix(in srgb, var(--accent) 80%, #000),
      inset 0 1px 0 rgba(255,255,255,.7);
  }

  :is(button, input[type="range"]):focus-visible {
    outline: 3px solid var(--accent-ink);
    outline-offset: 3px;
  }

  /* ---------- Keyboard ---------- */
  .keyboard { display: flex; flex-direction: column; gap: 6px; margin-top: 20px; }
  .kb-row { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .key {
    min-width: 38px;
    height: 46px;
    padding: 0 8px;
    border-radius: 13px;
    font-size: 1.05rem;
    font-weight: 800;
    text-transform: uppercase;
    display: grid;
    place-items: center;
  }
  .key.correct {
    background: var(--gloss), linear-gradient(180deg, var(--correct-hi), var(--correct-lo));
    color: #fff;
    border-color: rgba(255,255,255,.7);
    text-shadow: 0 1px 2px rgba(0,50,20,.6);
  }
  .key.present {
    background: var(--gloss), linear-gradient(180deg, var(--present-hi), var(--present-lo));
    color: #4a2f00;
    border-color: rgba(255,255,255,.7);
  }
  .key.absent {
    background: var(--gloss), linear-gradient(180deg, var(--absent-hi), var(--absent-lo));
    color: #fff;
    border-color: rgba(255,255,255,.6);
    text-shadow: 0 1px 2px rgba(10,30,50,.55);
  }

  /* ---------- Status / hints ---------- */
  .status {
    position: relative;
    margin-top: 20px;
    padding: 14px 20px 14px 52px;
    border-radius: 20px;
    background: rgba(255,255,255,.62);
    border: 1px solid rgba(255,255,255,.95);
    box-shadow: inset 0 1px 0 #fff, 0 8px 18px -12px rgba(8,80,140,.5);
    min-height: 3.1em;
    line-height: 1.5;
    font-weight: 600;
    color: var(--ink);
    transition: background .4s;
  }
  .status::before {
    content: '';
    position: absolute;
    left: 18px; top: 50%;
    width: 20px; height: 20px;
    transform: translateY(-50%);
    border-radius: 50%;
    background:
      radial-gradient(circle at 35% 28%, #fff 0 14%, rgba(255,255,255,0) 34%),
      linear-gradient(180deg, var(--accent-hi), var(--accent-lo));
    box-shadow: 0 3px 8px -2px color-mix(in srgb, var(--accent) 80%, #000), inset 0 0 0 1px rgba(255,255,255,.6);
  }
  .status.win  { background: rgba(214,255,228,.8); }
  .status.lose { background: rgba(255,222,229,.82); }
  .status.win::before {
    background: radial-gradient(circle at 35% 28%, #fff 0 14%, rgba(255,255,255,0) 34%), linear-gradient(180deg, var(--correct-hi), var(--correct-lo));
  }
  .status.lose::before {
    background: radial-gradient(circle at 35% 28%, #fff 0 14%, rgba(255,255,255,0) 34%), linear-gradient(180deg, #ff8fa3, #d2284a);
  }
  .status a {
    color: var(--accent-ink);
    font-weight: 800;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .footer-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 18px;
    flex-wrap: wrap;
  }

  .hint-box {
    display: none;
    margin-top: 16px;
    padding: 14px 20px;
    border-radius: 20px;
    background: rgba(255,246,208,.78);
    border: 1px solid rgba(255,255,255,.95);
    box-shadow: inset 0 1px 0 #fff, 0 8px 18px -12px rgba(120,80,0,.5);
    color: #5b4300;
    line-height: 1.55;
    font-weight: 600;
  }
  .hint-box.visible { display: block; }
  .hint-box strong { color: #3b2a00; }
  .hint-box::before {
    content: 'Hint';
    display: block;
    width: fit-content;
    margin-bottom: 8px;
    padding: 1px 12px;
    border-radius: 999px;
    background: var(--gloss), linear-gradient(180deg, var(--present-hi), var(--present-lo));
    color: #4a2f00;
    font-size: .85rem;
    font-weight: 800;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.8);
  }

  @media (max-width: 620px) {
    .app { border-radius: 26px; }
    .window-body { padding: 22px 14px 24px; }
    .orb { width: 56px; height: 56px; font-size: 1.8rem; }
    h1 { font-size: 2.1rem; }
    .passage { padding: 18px 18px; font-size: 1.04rem; }
    .slot { width: .85em; }
    .tile { width: 32px; height: 32px; font-size: 1.05rem; border-radius: 10px; }
    .tile.small { width: 24px; height: 24px; font-size: .88rem; border-radius: 8px; }
    .key { min-width: 29px; height: 42px; padding: 0 5px; font-size: .95rem; border-radius: 11px; }
    .kb-row { gap: 5px; }
    input[type="text"] { padding: 11px 16px; letter-spacing: .16em; }
    button { padding: 11px 18px; }
  }

  @media (prefers-reduced-motion: reduce) {
    :root { transition: none; }
    .bubble { animation: none; bottom: 0; transform: translateY(var(--ry, -40vh)); }
    button, .status, .tile, input[type="text"] { transition: none; }
  }
</style>
</head>
<body>
<div class="sky" aria-hidden="true">
  <div class="sun"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
  <div class="hill h1"></div>
  <div class="hill h2"></div>
  <span class="bubble" style="--x:7%;  --s:46px; --d:26s; --delay:-4s;  --ry:-30vh"></span>
  <span class="bubble" style="--x:19%; --s:20px; --d:19s; --delay:-12s; --ry:-62vh"></span>
  <span class="bubble" style="--x:34%; --s:62px; --d:32s; --delay:-20s; --ry:-48vh"></span>
  <span class="bubble" style="--x:58%; --s:28px; --d:22s; --delay:-8s;  --ry:-72vh"></span>
  <span class="bubble" style="--x:72%; --s:54px; --d:30s; --delay:-16s; --ry:-26vh"></span>
  <span class="bubble" style="--x:86%; --s:24px; --d:21s; --delay:-2s;  --ry:-56vh"></span>
  <span class="bubble" style="--x:93%; --s:38px; --d:27s; --delay:-23s; --ry:-38vh"></span>
</div>

<main class="app">
  <div class="window-body">
    <header>
      <div class="brand">
        <div class="orb"><span>?</span></div>
        <div class="brand-text">
          <h1>What&rsquo;s missing?</h1>
          <div class="sub">Find the missing word in a random Wikipedia article</div>
        </div>
      </div>
    </header>

    <div class="passage" id="passage"><p class="loading">Loading a random article…</p></div>

    <div style="text-align:center;margin-top:18px"><div class="badge" id="badge">Loading…</div></div>

    <div class="grid" id="grid"></div>

    <div class="input-row">
      <input type="text" id="guessInput" placeholder="Type the missing word" autocomplete="off" autocapitalize="characters" spellcheck="false" disabled>
      <button id="submitBtn" class="primary" disabled>Guess</button>
    </div>

    <div class="keyboard" id="keyboard"></div>

    <div class="footer-actions">
      <button id="hintBtn" disabled>Hint</button>
      <button id="giveUpBtn" disabled>Give up</button>
      <button id="newBtn">New article</button>
    </div>

    <div class="hint-box" id="hintBox"></div>
    <div class="status" id="status" aria-live="polite">Loading a random article…</div>
  </div>
</main>

<script>
const KEYBOARD_ROWS = ['QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM'];
const MAX_ATTEMPTS = 6;
const AUTO_HINT_AFTER = 3;
const MAX_CHARS = 850;

// Accent palette: green, sky blue, amber, orange, pink-red (changes each round)
const ACCENTS = ['#22b573', '#1e90e6', '#ee9a00', '#f0622a', '#e5365f'];

const STOP = new Set(('about above after again against almost along already also although always among another around because before behind being below between both '
  + 'cannot could during either enough every first following from further given have having here however include included including into itself just later least less '
  + 'might more most much must never next often once only other others over perhaps quite rather said same several since some still such than that their them then '
  + 'there these they this those though through thus together under until upon very were what when where whether which while whose will with within without would '
  + 'years year known called named').split(/\s+/));

const grid       = document.getElementById('grid');
const passage    = document.getElementById('passage');
const badge      = document.getElementById('badge');
const guessInput = document.getElementById('guessInput');
const submitBtn  = document.getElementById('submitBtn');
const keyboard   = document.getElementById('keyboard');
const hintBtn    = document.getElementById('hintBtn');
const giveUpBtn  = document.getElementById('giveUpBtn');
const newBtn     = document.getElementById('newBtn');
const hintBox    = document.getElementById('hintBox');
const status     = document.getElementById('status');

let state = null;
let lastAccent = -1;

/* ---------- helpers ---------- */
function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

const WORD_RE = /[\p{L}\p{M}'\u2019-]+/gu;

function clipText(raw) {
  let text = raw
    .replace(/\s*\(\s*\)/g, '')
    .replace(/[ \t]+/g, ' ')
    .replace(/\n\s*\n+/g, '\n')
    .trim();
  if (text.length <= MAX_CHARS) return text;
  const cut = text.slice(0, MAX_CHARS);
  const idx = Math.max(cut.lastIndexOf('. '), cut.lastIndexOf('.\n'));
  if (idx > 300) return cut.slice(0, idx + 1);
  return cut.slice(0, cut.lastIndexOf(' ')) + '…';
}

function pickWord(text, title) {
  const titleWords = new Set(title.toLowerCase().match(/[a-z]+/g) || []);
  const cand = [];
  let m;
  WORD_RE.lastIndex = 0;
  while ((m = WORD_RE.exec(text))) {
    const t = m[0];
    if (!/^[A-Za-z]{5,12}$/.test(t)) continue;
    const lw = t.toLowerCase();
    if (STOP.has(lw) || titleWords.has(lw)) continue;
    cand.push({ w: lw, lower: t[0] === lw[0] });
  }
  const lowers = cand.filter(c => c.lower);
  const pool = lowers.length >= 3 ? lowers : cand;
  if (!pool.length) return null;
  return pool[Math.floor(Math.random() * pool.length)].w.toUpperCase();
}

async function fetchRound() {
  const url = 'https://en.wikipedia.org/w/api.php?action=query&generator=random&grnnamespace=0&grnlimit=1'
    + '&prop=extracts|info&exintro=1&explaintext=1&inprop=url&format=json&formatversion=2&origin=*';
  const maxTries = 25;
  for (let i = 0; i < maxTries; i++) {
    try {
      const res = await fetch(url);
      if (!res.ok) continue;
      const data = await res.json();
      const page = data.query && data.query.pages && data.query.pages[0];
      if (!page || !page.extract) continue;
      if (/^List of /i.test(page.title) || /may refer to/i.test(page.extract)) continue;
      const text = clipText(page.extract);
      if (text.length < 250) continue;
      const target = pickWord(text, page.title);
      if (!target) continue;
      return {
        title: page.title,
        url: page.fullurl || ('https://en.wikipedia.org/wiki/' + encodeURIComponent(page.title)),
        text, target,
      };
    } catch (e) { /* retry */ }
  }
  throw new Error('Could not find a good article after ' + maxTries + ' tries. Try again.');
}

function evaluate(guess, target) {
  const result = new Array(guess.length).fill('absent');
  const used = new Array(target.length).fill(false);
  for (let i = 0; i < guess.length; i++) {
    if (guess[i] === target[i]) { result[i] = 'correct'; used[i] = true; }
  }
  for (let i = 0; i < guess.length; i++) {
    if (result[i] === 'correct') continue;
    for (let j = 0; j < target.length; j++) {
      if (!used[j] && target[j] === guess[i]) {
        result[i] = 'present'; used[j] = true; break;
      }
    }
  }
  return result;
}

/* ---------- rendering ---------- */
function blankHtml(n) {
  return '<span class="blank" role="img" aria-label="Missing word, ' + n + ' letters">'
    + '<span class="slot"></span>'.repeat(n) + '</span>';
}

function renderPassage() {
  const target = state.target.toLowerCase();
  const paras = state.text.split('\n').filter(Boolean);
  passage.innerHTML = paras.map(p => {
    let out = '', last = 0, m;
    WORD_RE.lastIndex = 0;
    while ((m = WORD_RE.exec(p))) {
      if (m[0].toLowerCase() !== target) continue;
      out += escapeHtml(p.slice(last, m.index)) + blankHtml(state.target.length);
      last = m.index + m[0].length;
    }
    out += escapeHtml(p.slice(last));
    return '<p>' + out + '</p>';
  }).join('');
  updateBlanks();
}

function updateBlanks() {
  if (!state) return;
  const revealAll = state.over;
  passage.querySelectorAll('.blank').forEach(b => {
    b.classList.toggle('win', state.won === true);
    b.classList.toggle('lose', state.over && state.won === false);
    [...b.children].forEach((slot, i) => {
      const showFirst = state.hintStep >= 2 && i === 0;
      slot.textContent = (revealAll || showFirst) ? state.target[i] : '';
      slot.classList.toggle('hinted', showFirst && !revealAll);
    });
  });
}

function render() {
  const small = state.target.length > 11;
  grid.innerHTML = '';
  for (let r = 0; r < state.maxAttempts; r++) {
    const row = document.createElement('div');
    row.className = 'row';
    const attempt = state.attempts[r];
    for (let j = 0; j < state.target.length; j++) {
      const tile = document.createElement('div');
      tile.className = 'tile' + (small ? ' small' : '');
      if (attempt) {
        tile.textContent = attempt.guess[j] || '';
        tile.classList.add(attempt.result[j]);
      }
      row.appendChild(tile);
    }
    grid.appendChild(row);
  }
  renderKeyboard();
}

function renderKeyboard() {
  const letterStates = {};
  for (const attempt of state.attempts) {
    for (let i = 0; i < attempt.guess.length; i++) {
      const ch = attempt.guess[i];
      const r = attempt.result[i], cur = letterStates[ch];
      if (r === 'correct') letterStates[ch] = 'correct';
      else if (r === 'present' && cur !== 'correct') letterStates[ch] = 'present';
      else if (!cur) letterStates[ch] = 'absent';
    }
  }
  keyboard.innerHTML = '';
  for (const rowStr of KEYBOARD_ROWS) {
    const row = document.createElement('div');
    row.className = 'kb-row';
    for (const ch of rowStr) {
      const key = document.createElement('button');
      key.className = 'key';
      key.textContent = ch;
      if (letterStates[ch]) key.classList.add(letterStates[ch]);
      key.addEventListener('click', () => {
        if (!state || state.over) return;
        if (guessInput.value.length < state.target.length) guessInput.value += ch;
      });
      row.appendChild(key);
    }
    keyboard.appendChild(row);
  }
}

function renderHints() {
  const parts = [];
  if (state.hintStep >= 1) parts.push('<div><strong>Article:</strong> ' + escapeHtml(state.title) + '</div>');
  if (state.hintStep >= 2) parts.push('<div><strong>First letter:</strong> ' + state.target[0] + '</div>');
  hintBox.innerHTML = parts.join('');
  hintBox.classList.toggle('visible', parts.length > 0);
  hintBtn.disabled = state.over || state.hintStep >= 2;
  updateBlanks();
}

function setAccent() {
  let idx;
  do { idx = Math.floor(Math.random() * ACCENTS.length); } while (idx === lastAccent);
  lastAccent = idx;
  document.documentElement.style.setProperty('--accent', ACCENTS[idx]);
}

function setControls(enabled) {
  guessInput.disabled = !enabled;
  submitBtn.disabled = !enabled;
  hintBtn.disabled = !enabled;
  giveUpBtn.disabled = !enabled;
}

/* ---------- game flow ---------- */
async function newGame() {
  state = null;
  setAccent();
  badge.textContent = 'Loading…';
  status.className = 'status';
  status.textContent = 'Finding a random article…';
  passage.innerHTML = '<p class="loading">Loading a random article…</p>';
  hintBox.className = 'hint-box';
  hintBox.innerHTML = '';
  grid.innerHTML = '';
  keyboard.innerHTML = '';
  guessInput.value = '';
  setControls(false);
  newBtn.disabled = true;

  try {
    const round = await fetchRound();
    state = {
      ...round,
      maxAttempts: MAX_ATTEMPTS,
      attempts: [], hintStep: 0, over: false, won: null,
    };
    badge.textContent = state.target.length + ' letters, ' + MAX_ATTEMPTS + ' tries';
    guessInput.maxLength = state.target.length;
    setControls(true);
    guessInput.focus();
    status.textContent = 'Guess the missing word. You have ' + MAX_ATTEMPTS + ' tries.';
    renderPassage();
    render();
  } catch (err) {
    passage.innerHTML = '<p class="loading">No article loaded.</p>';
    badge.textContent = 'Something went wrong';
    status.textContent = 'Error: ' + err.message;
  } finally {
    newBtn.disabled = false;
  }
}

function finish(won, gaveUp) {
  state.over = true;
  state.won = won;
  const link = '<a href="' + state.url + '" target="_blank" rel="noopener noreferrer">Read the article</a>';
  const word = '<strong>' + escapeHtml(state.target.toLowerCase()) + '</strong>';
  if (won) {
    const tries = state.attempts.length;
    status.className = 'status win';
    status.innerHTML = 'Found it in ' + tries + ' ' + (tries === 1 ? 'try' : 'tries') + '! The word is ' + word + '. ' + link;
  } else {
    status.className = 'status lose';
    status.innerHTML = (gaveUp ? 'Revealed. ' : 'Out of tries. ') + 'The word was ' + word + '. ' + link;
  }
  setControls(false);
  updateBlanks();
}

function submitGuess() {
  if (!state || state.over) return;

  const letters = guessInput.value.toUpperCase().replace(/[^A-Z]/g, '');
  if (letters.length !== state.target.length) {
    status.className = 'status';
    status.textContent = 'Enter exactly ' + state.target.length + ' letters.';
    return;
  }

  const result = evaluate(letters, state.target);
  state.attempts.push({ guess: letters, result });
  guessInput.value = '';

  if (letters === state.target) {
    render();
    finish(true);
    return;
  }
  if (state.attempts.length >= state.maxAttempts) {
    render();
    finish(false);
    return;
  }

  const left = state.maxAttempts - state.attempts.length;
  status.className = 'status';
  status.textContent = left + ' ' + (left === 1 ? 'try' : 'tries') + ' left.';

  if (state.attempts.length >= AUTO_HINT_AFTER && state.hintStep < 1) {
    state.hintStep = 1;
    renderHints();
  }

  render();
  guessInput.focus();
}

guessInput.addEventListener('input', () => {
  guessInput.value = guessInput.value
    .toUpperCase().replace(/[^A-Z]/g, '')
    .slice(0, state ? state.target.length : 0);
});
guessInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); submitGuess(); }
});
submitBtn.addEventListener('click', submitGuess);

hintBtn.addEventListener('click', () => {
  if (!state || state.over || state.hintStep >= 2) return;
  state.hintStep += 1;
  renderHints();
});

giveUpBtn.addEventListener('click', () => {
  if (!state || state.over) return;
  finish(false, true);
});

newBtn.addEventListener('click', newGame);

/* ---------- boot ---------- */
newGame();
</script>
